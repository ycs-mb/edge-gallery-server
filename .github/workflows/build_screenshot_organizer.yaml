name: Build Smart Screenshot Organizer

on:
  workflow_dispatch:
  push:
    branches: [ "feature/screenshot-organizer" ]
    paths:
      - "SmartScreenshotOrganizer/**"
      - ".github/workflows/build_screenshot_organizer.yaml"
  pull_request:
    paths:
      - "SmartScreenshotOrganizer/**"
      - ".github/workflows/build_screenshot_organizer.yaml"

jobs:
  build:
    name: Unit tests + debug & release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SmartScreenshotOrganizer
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-sso-${{ hashFiles('SmartScreenshotOrganizer/**/*.gradle*', 'SmartScreenshotOrganizer/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-sso-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-organizer-debug
          path: SmartScreenshotOrganizer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-organizer-release
          path: SmartScreenshotOrganizer/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
